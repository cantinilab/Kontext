[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kontext"
version = "0.1.0"
description = "Spatial context-aware analysis for single-cell and spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Anthony Ozier-Lafontaine", email = "anthony.ozier-lafontaine@pasteur.fr"},
]
keywords = [
    "spatial-transcriptomics",
    "single-cell",
    "spatial-domains",
    "ligand-receptor",
    "neighborhood",
    "clustering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scanpy>=1.9.8",
    "anndata>=0.10.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "liana>=0.1",
    "numba>=0.58",
    "psutil>=5.9",
    "plotly>=5.0",
    "pynndescent>=0.5",
    "leidenalg>=0.9",     # required by clustering.py
]

[project.optional-dependencies]
gpu = [
    "torch",
]
dev = [
    "pytest",
    "black",
    "flake8",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/cantinilab/kontext"
Repository = "https://github.com/cantinilab/kontext"
Issues = "https://github.com/cantinilab/kontext/issues"

[tool.setuptools.packages.find]
where = ["src"]